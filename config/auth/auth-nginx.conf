# Basic-auth front door for the Cloudflare Tunnel Web GUI (woow-cf-tunnel-auth).
# scripts/install.sh --with-auth renders this file into
# ~/.config/woow-cf-tunnel/auth-nginx.conf (AUTH_LISTEN and UVICORN_PORT come from
# the env file). Edit the repo copy and re-run install.sh.
user nginx nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    # Temp paths in /tmp so the master does not need to write into the
    # nginx-owned /var/cache/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen @@AUTH_LISTEN@@;
        server_name _;

        location = /healthz { auth_basic off; access_log off; return 204; }

        location / {
            auth_basic "Cloudflare Tunnel Web GUI";
            auth_basic_user_file /etc/nginx/htpasswd;

            proxy_pass http://127.0.0.1:@@UVICORN_PORT@@;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # /ws/logs and /api/setup/login are WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
